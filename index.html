<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lousã Volei - App de Gestão</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- SCREEN 1: LOGIN -->
  <div id="loginScreen" class="screen">
    <div class="container">
      <div class="login-card">
        <div class="logo-container">
          <img src="logo.png" alt="Lousã Volei" class="logo-large">
        </div>
        <h1>Lousã Volei</h1>
        <p class="subtitle">App de Gestão de Equipas</p>

        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="seu@email.com">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>

          <button type="submit" id="authBtn" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-toggle">
          <p id="toggleText">Não tens conta? <a href="#" onclick="toggleAuthMode(event)">Criar nova</a></p>
        </div>

        <div id="authError" class="error" style="display: none;"></div>
        <div id="authSuccess" class="success" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: DASHBOARD -->
  <div id="dashboardScreen" class="screen" style="display: none;">
    <div class="container">
      <div class="header">
        <div class="header-left">
          <img src="logo.png" alt="Lousã Volei" class="logo-small">
          <h1>Lousã Volei</h1>
        </div>
        <div class="user-info">
          <span id="userEmail"></span>
          <button onclick="handleLogout()" class="btn-logout">Sair</button>
        </div>
      </div>

      <div class="content">
        <h2>Minhas Equipas</h2>
        <div id="teamsContainer" class="teams-grid">
          <p class="loading">Carregando equipas...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: CALENDÁRIO -->
  <div id="calendarScreen" class="screen" style="display: none;">
    <div class="container">
      <div class="header">
        <button onclick="goToDashboard()" class="btn-back">← Voltar</button>
        <h1 id="teamName"></h1>
        <div></div>
      </div>

      <div class="content">
        <h2>Eventos</h2>
        <div id="eventsContainer" class="events-list">
          <p class="loading">Carregando eventos...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="env.js"></script>
  <script src="main.js"></script>
</body>
</html>
